name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Skips quietly until the Cloudflare secrets are configured on the repository.
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip until Cloudflare secrets are set
        if: env.CONFIGURED != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
      - uses: pnpm/action-setup@v4
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CONFIGURED == 'true'
      - name: Build
        if: env.CONFIGURED == 'true'
        run: pnpm --filter @seen/web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Publish
        if: env.CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name seen --branch main --commit-dirty=true
