name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  container:
    name: API image and Compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate production Compose file
        run: docker compose -f compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          OWNER_PASSWORD_HASH: ci-placeholder
          TMDB_API_TOKEN: ci-placeholder
          CORS_ORIGINS: https://seen.example.invalid
          POSTGRES_USER: seen
          POSTGRES_DB: seen
