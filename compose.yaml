# Production stack deployed by Coolify (application type: Docker Compose).
# Coolify injects the environment variables referenced below and attaches the public
# domain plus TLS certificate to the `api` service on port 3000. Nothing publishes a host port.
# Required variables: POSTGRES_PASSWORD, OWNER_PASSWORD_HASH, TMDB_API_TOKEN, CORS_ORIGINS (the API refuses to start without them).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-seen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-seen}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Web Push (optional): set all three or none. Generate keys with `pnpm --filter @seen/api vapid`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seen} -d ${POSTGRES_DB:-seen}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
